name: CI

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop, release]

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .flutter-version

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase configuration or generate CI stub
        # Dummy Firebase values allow builds from forks without authenticating to a real project.
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ ! -f "android/app/google-services.json" ]; then
            mkdir -p android/app
            printf '%s\n' '{"project_info":{"project_number":"1234567890","project_id":"dummy-ci-project","storage_bucket":"dummy-ci-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:dummyappid","android_client_info":{"package_name":"com.ekerstudio.glucosa"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{}},{"client_info":{"mobilesdk_app_id":"1:1234567890:android:dummyappid_debug","android_client_info":{"package_name":"com.ekerstudio.glucosa.dev"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

          if [ -f "android/app/google-services.json" ] && ! grep -q "com.ekerstudio.glucosa.dev" android/app/google-services.json; then
            python3 -c "import copy, json; path='android/app/google-services.json'; data=json.load(open(path)); client=copy.deepcopy(data['client'][0]); client['client_info']['android_client_info']['package_name']='com.ekerstudio.glucosa.dev'; data['client'].append(client); json.dump(data, open(path, 'w'), indent=2)"
          fi

      - name: Cache Isar core binary
        id: cache-isar
        uses: actions/cache@v4
        with:
          path: libisar.so
          key: ${{ runner.os }}-isar-${{ hashFiles('**/pubspec.lock') }}

      - name: Fetch Isar core binary for native tests
        if: steps.cache-isar.outputs.cache-hit != 'true'
        run: |
          ISAR_VERSION=$(awk '/isar_community:/{flag=1; next} flag && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "Using Isar version: $ISAR_VERSION"
          curl -fsSL "https://binaries.isar-community.dev/${ISAR_VERSION}/libisar_linux_x64.so" -o libisar.so

      - name: Generate localization files (i18n)
        run: flutter gen-l10n

      - name: Run code generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: |
          FORMAT_DIRS="lib test"
          [ -d "integration_test" ] && FORMAT_DIRS="$FORMAT_DIRS integration_test"
          [ -d "test_driver" ] && FORMAT_DIRS="$FORMAT_DIRS test_driver"
          dart format --set-exit-if-changed $FORMAT_DIRS

      - name: Static analysis
        run: flutter analyze

      - name: Riverpod-specific lints (custom_lint)
        run: dart run custom_lint

      - name: Run unit and widget tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
        run: flutter test --coverage --exclude-tags "golden,screenshot"

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Generate Coverage Job Summary
        if: always()
        run: |
          if [ -f "coverage/lcov.info" ]; then
            sed -i.bak '/SF:.*\.g\.dart/,/end_of_record/d' coverage/lcov.info
            sed -i.bak '/SF:.*app_localizations.*\.dart/,/end_of_record/d' coverage/lcov.info
            rm -f coverage/lcov.info.bak

            TOTAL_LF=$(grep '^LF:' coverage/lcov.info | awk -F: '{s+=$2} END {print s}')
            TOTAL_LH=$(grep '^LH:' coverage/lcov.info | awk -F: '{s+=$2} END {print s}')

            if [ -n "$TOTAL_LF" ] && [ "$TOTAL_LF" -gt 0 ]; then
              PCT=$(awk "BEGIN {printf \"%.2f\", ($TOTAL_LH / $TOTAL_LF) * 100}")
              echo "### 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              echo "| **Line Coverage** | \`$PCT%\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Lines Hit / Total** | \`$TOTAL_LH\` / \`$TOTAL_LF\` |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          retention-days: 14
