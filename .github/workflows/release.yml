name: Release

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .flutter-version

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ ! -f "android/app/google-services.json" ]; then
            mkdir -p android/app
            printf '%s\n' '{"project_info":{"project_number":"1234567890","project_id":"dummy-ci-project","storage_bucket":"dummy-ci-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:dummyappid","android_client_info":{"package_name":"com.ekerstudio.glucosa"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{}},{"client_info":{"mobilesdk_app_id":"1:1234567890:android:dummyappid_debug","android_client_info":{"package_name":"com.ekerstudio.glucosa.dev"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

          if [ -f "android/app/google-services.json" ] && ! grep -q "com.ekerstudio.glucosa.dev" android/app/google-services.json; then
            python3 -c "import copy, json; path='android/app/google-services.json'; data=json.load(open(path)); client=copy.deepcopy(data['client'][0]); client['client_info']['android_client_info']['package_name']='com.ekerstudio.glucosa.dev'; data['client'].append(client); json.dump(data, open(path, 'w'), indent=2)"
          fi

      - name: Cache Isar core binary
        id: cache-isar
        uses: actions/cache@v4
        with:
          path: libisar.so
          key: ${{ runner.os }}-isar-${{ hashFiles('**/pubspec.lock') }}

      - name: Fetch Isar core binary for native tests
        if: steps.cache-isar.outputs.cache-hit != 'true'
        run: |
          ISAR_VERSION=$(awk '/isar_community:/{flag=1; next} flag && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "Using Isar version: $ISAR_VERSION"
          curl -fsSL "https://binaries.isar-community.dev/${ISAR_VERSION}/libisar_linux_x64.so" -o libisar.so

      - name: Generate localization files (i18n)
        run: flutter gen-l10n

      - name: Run code generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: |
          FORMAT_DIRS="lib test"
          [ -d "integration_test" ] && FORMAT_DIRS="$FORMAT_DIRS integration_test"
          [ -d "test_driver" ] && FORMAT_DIRS="$FORMAT_DIRS test_driver"
          dart format --set-exit-if-changed $FORMAT_DIRS

      - name: Static analysis
        run: flutter analyze

      - name: Riverpod-specific lints (custom_lint)
        run: dart run custom_lint

      - name: Run unit and widget tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
        run: flutter test --coverage --exclude-tags "golden,screenshot"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets['KEYSTORE_BASE64'] }}
          KEYSTORE_PASSWORD: ${{ secrets['KEYSTORE_PASSWORD'] }}
          KEY_ALIAS: ${{ secrets['KEY_ALIAS'] }}
          KEY_PASSWORD: ${{ secrets['KEY_PASSWORD'] }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore configured — building unsigned package"
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "All Android signing secrets are required when KEYSTORE_BASE64 is configured."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "storeFile=release.keystore" >> android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=ENVIRONMENT=prod

      - name: Build App Bundle (AAB release)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=ENVIRONMENT=prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.sha }}
          path: build/symbols/
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
