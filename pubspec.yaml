name: flutter_glucosa
description: "A local-first metabolic health and blood glucose monitoring application for people with diabetes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  intl: ^0.20.3
  go_router: ^18.0.2
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0
  local_auth_darwin: ^2.0.4
  csv: ^8.0.0
  file_picker: ^13.1.0
  health: ^13.3.2
  permission_handler: ^13.0.2
  flutter_blue_plus: ^1.35.0
  home_widget: ^0.10.0
  firebase_core: ^4.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  isar_community_generator: ^3.3.2
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  # Required by biometric test doubles faking LocalAuthPlatform.
  local_auth_platform_interface: ^1.1.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  # 1. Standard Icon (iOS Light Mode / Legacy iOS / Fallback)
  image_path: "assets/icon/app_icon.png"

  # 2. iOS 18+ Dark Mode
  image_path_ios_dark: "assets/icon/app_icon_dark.png"

  # 3. iOS 18+ Tinted Mode
  image_path_ios_tinted: "assets/icon/app_icon_monochrome.png"
  
  # Android Adaptive Icons (API 26+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # Android 13+ Dynamic Themed Icons (Material You)
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

flutter_native_splash:
  color: "#FDF7FF"
  color_dark: "#141218"

  image: "assets/icon/splash_light.png"
  image_dark: "assets/icon/splash_dark.png"

  android_12:
    image: "assets/icon/splash_light.png"
    image_dark: "assets/icon/splash_dark.png"
    icon_background_color: "#FDF7FF"
    icon_background_color_dark: "#141218"

  android: true
  ios: true
